name: tests

on:
    push:
    pull_request:

jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-python@v7
              with:
                  python-version: "3.x"
            - run: pip install ruff
            - run: ruff check --select F,E9 --output-format=github .

    test:
        needs: lint
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, macos-latest, windows-latest]
                python: ["3.12", "3.x"]
        runs-on: ${{ matrix.os }}
        env:
            PYTHONUTF8: "1"
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-python@v7
              with:
                  python-version: ${{ matrix.python }}
            - run: python -m core.check_requirements
            - run: python -m unittest discover -s tests -t tests -v
